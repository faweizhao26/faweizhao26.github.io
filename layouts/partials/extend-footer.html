{{ $isZh := eq .Site.Language.Lang "zh-cn" }}
{{ if .Site.Params.busuanzi.enable }}
  <div class="mt-3 text-xs text-neutral-500 dark:text-neutral-400 flex flex-wrap gap-x-4 gap-y-1">
    <span id="busuanzi_container_site_uv">
      {{ if $isZh }}访客{{ else }}Visitors{{ end }}：
      <span id="busuanzi_value_site_uv">--</span>
    </span>
    <span id="busuanzi_container_site_pv">
      {{ if $isZh }}访问量{{ else }}Page views{{ end }}：
      <span id="busuanzi_value_site_pv">--</span>
    </span>
  </div>
  <script async src="https://cn.vercount.one/js"></script>
{{ end }}
<div class="mt-3 text-xs text-neutral-500 dark:text-neutral-400">
  <a href="{{ "privacy" | relLangURL }}">{{ if $isZh }}隐私政策{{ else }}Privacy Policy{{ end }}</a>
</div>
