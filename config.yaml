baseURL: https://faweizhao26.github.io/
languageCode: zh-cn
title: Fawei's Blog
theme: blowfish

enableInlineShortcodes: true
enableEmoji: true
enableRobotsTXT: true
hasCJKLanguage: true

buildDrafts: false
buildFuture: false
buildExpired: false

#googleAnalytics: UA-123-45 # 谷歌统计
# Copyright: Sulv

pagination:
  pagerSize: 10

minify:
  disableXML: true

permalinks:
  post: "/:title/"

defaultContentLanguage: zh-cn  # 将默认语言改为中文
defaultContentLanguageInSubdir: false  # 禁用子目录
languages:
  zh-cn:
    languageName: "中文"
    weight: 1
    params:
      displayName: "简体中文"
      Author:
        name: Fawei
        headline: "这里是运营人 Fawei 的工作总结与读书笔记<br>👏🏼欢迎光临<br>👇联系方式"
        image: "https://raw.githubusercontent.com/faweizhao26/images/main/XAgiAH.jpeg"
        links:
          - github: "https://github.com/faweizhao26"
          - x-twitter: "https://x.com/faweizhao"
          - wechat: "https://raw.githubusercontent.com/faweizhao26/images/main/WechatIMG1063.jpeg"
          - email: "mailto:faweizhao26@gmail.com"
          - rss: "https://faweizhao26.github.io/index.xml"
  en:
    languageName: "English"
    weight: 2
    params:
      displayName: "EN"
      Author:
        name: Fawei
        headline: "Operations notes and reading reflections<br>👏 Welcome<br>👇 Get in touch"
        image: "https://raw.githubusercontent.com/faweizhao26/images/main/XAgiAH.jpeg"
        links:
          - github: "https://github.com/faweizhao26"
          - x-twitter: "https://x.com/faweizhao"
          - wechat: "https://raw.githubusercontent.com/faweizhao26/images/main/WechatIMG1063.jpeg"
          - email: "mailto:faweizhao26@gmail.com"
          - rss: "https://faweizhao26.github.io/index.xml"
    menu:
      main:
        - identifier: about
          name: About
          url: /en/about/
          weight: 10
        - identifier: community
          name: Community Ops
          url: /en/posts/community/
          weight: 20
        - identifier: ai
          name: AI
          url: /en/posts/ai/
          weight: 30
        - identifier: read
          name: Reading
          url: /en/posts/read/
          weight: 40
        - identifier: life
          name: Essays
          url: /en/posts/others/
          weight: 50
        - identifier: twitter
          pre: x-twitter
          url: "https://x.com/faweizhao"
          weight: 60
        - identifier: zhaoshuba
          name: Zhaoshuba
          url: "https://zhaoshuba.top"
          weight: 70
    # 移除了 profileMode 配置（应该放在全局 params 中）

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  colorScheme: blowfish
  logo: "logo.svg"
  defaultAppearance: light
  autoSwitchAppearance: true
  enableSearch: true
  enableCodeCopy: true
  enableStructuredBreadcrumbs: true
  mainSections:
    - posts
  homepage:
    layout: profile
    showRecent: true
    showRecentItems: 12
    showMoreLink: true
    showMoreLinkDest: posts
  list:
    groupByYear: false
    cardView: true
    showSummary: true
  article:
    showViews: true
    showComments: true
    showTableOfContents: true
  busuanzi:
    enable: true
  defaultTheme: auto
  disableThemeToggle: false
  DateFormat: "2006-01-02"
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideFooter: false
  ShowWordCounts: true
  VisitCount: true
  ShowLastMod: true
  comments: true
  smartTOC: true
  smartTOCHideUnfocusedChildren: true
  
  # 主页布局配置
  profileMode:
      enabled: true
      title: Hi
      subtitle: "这里是运营人 Fawei 的工作总结与读书笔记<br>👏🏼欢迎光临<br>👇联系方式"
      imageUrl: "https://raw.githubusercontent.com/faweizhao26/images/main/XAgiAH.jpeg"
      imageTitle: 
      imageWidth: 150
      imageHeight: 150
      buttons:
        - name: 👨🏻‍💻 社区运营
          url: posts/community
        - name: 📕 读书笔记
          url: posts/read
        - name: 🏖 其他
          url: posts/others
  
  # 社交图标配置
  socialIcons:
    - name: github
      url: "https://github.com/faweizhao26"
    - name: X
      url: "https://x.com/faweizhao"
    - name: WeChat
      url: "https://raw.githubusercontent.com/faweizhao26/images/main/WechatIMG1063.jpeg"
    - name: email
      url: "mailto:faweizhao26@gmail.com"
    - name: RSS
      url: "index.xml"
  
  assets:
    favicon: "img/Q.gif"
    favicon16x16: "img/Q.gif"
    favicon32x32: "img/Q.gif"
    apple_touch_icon: "Q.gif"
    safari_pinned_tab: "Q.gif"
  
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 1
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary"]
  
  twikoo:
    version: 1.4.11

  umamiAnalytics:
    websiteid: "270d3165-e850-4ae7-8e6c-aa6baa41421d"
    domain: "cloud.umami.is"
  
  # 隐藏主页上的文章列表
  hideHomePosts: true

# 菜单配置（放在 params 之外）
menu:
  main:
    - identifier: about
      name: 🙋🏻‍♂️ 关于
      url: /about/
      weight: 10
    - identifier: community
      name: 社区运营
      url: /posts/community/
      weight: 20
    - identifier: ai
      name: AI
      url: /posts/ai/
      weight: 30
    - identifier: read
      name: 读书
      url: /posts/read/
      weight: 40
    - identifier: life
      name: 随笔
      url: /posts/others/
      weight: 50
    - identifier: twitter
      pre: x-twitter
      url: "https://x.com/faweizhao"
      weight: 60
    - identifier: zhaoshuba
      name: 找书吧
      url: "https://zhaoshuba.top"
      weight: 70

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: darcula

privacy:
  vimeo:
    disabled: false
    simple: true
  x:
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
